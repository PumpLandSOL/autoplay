services:
  - type: web
    name: autoplay
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node server/index.js
    healthCheckPath: /api/stats
    autoDeploy: true
    disk:
      name: autoplay-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_PATH
        value: /data
      - key: MASTER_KEY
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://autoplaypad.net
      - key: SOL_RPC
        sync: false
